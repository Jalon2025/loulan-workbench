name: 新闻资讯定时抓取

on:
  schedule:
    # 每 30 分钟抓一次（UTC 时间，GitHub 定时任务可能有几分钟排队）
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wb-news-fetch
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取并生成新闻资讯.js
        run: node scripts/build-news.mjs

      - name: 提交生成结果
        run: |
          git config user.name "wb-news-bot"
          git config user.email "wb-news-bot@users.noreply.github.com"
          git add 新闻资讯.js
          if git diff --cached --quiet; then
            echo "本次抓取内容无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(news): auto fetch $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
